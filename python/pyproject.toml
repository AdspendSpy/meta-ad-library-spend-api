[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adspendspy"
version = "0.2.0"
description = "Competitor ad spend API client - query Meta (Facebook/Instagram) ad spend, creatives and hooks from AdSpendSpy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AdSpendSpy", email = "hello@adspendspy.com" }]
keywords = [
    "competitor-ad-spend",
    "meta-ads",
    "facebook-ads",
    "ad-library",
    "ad-intelligence",
    "api-client",
    "marketing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://www.adspendspy.com"
Documentation = "https://github.com/adspendspy/meta-ad-library-spend-api#readme"
Source = "https://github.com/adspendspy/meta-ad-library-spend-api"

[tool.setuptools.packages.find]
include = ["adspendspy*"]
